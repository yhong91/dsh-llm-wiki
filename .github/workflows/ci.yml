name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The suite is TypeScript run directly by Node, which needs >= 22.6.
        # The built plugin itself supports Node 20 (see package.json engines).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Install scripts are skipped: the optional native QMD dependency is not
      # needed to build or to run the suite, and its postinstall can fail.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The suite builds its own fixture vaults and must not need ~/.llm-wiki.
      - run: npm test
